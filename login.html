<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mess NCO Login | CRPF Mess</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#10583d,#061b13 65%);font-family:Arial,sans-serif;color:#fff}.card{width:min(100%,420px);padding:26px;border:1px solid #36845e;border-radius:20px;background:#0a3022;box-shadow:0 18px 55px #0008}.logo{text-align:center;margin:0 auto 4px}.logo img{display:block;width:72px;height:78px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 2px 5px #0007)}.eyebrow{text-align:center;color:#e5bb19;font-weight:bold;letter-spacing:1px;font-size:12px;margin-top:5px}h1{text-align:center;font-size:24px;margin:10px 0 6px;color:#f2c51a}p{color:#c1d8cc;text-align:center;font-size:13px;line-height:1.5;margin:0 0 20px}.field{margin:13px 0}label{display:block;font-size:12px;color:#d7e8de;margin-bottom:6px;font-weight:bold}input{width:100%;padding:13px;border-radius:9px;border:1px solid #438568;background:#061f16;color:#fff;font-size:16px;outline:none}input:focus{border-color:#e5bb19}button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:10px;background:#087b49;color:white;font-weight:bold;font-size:15px;cursor:pointer}button.secondary{background:#174b37;border:1px solid #438568}.message{min-height:20px;margin-top:12px;text-align:center;color:#ffd36b;font-size:13px}.note{font-size:11px;color:#93b6a3;text-align:center;margin-top:17px;line-height:1.5}.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
<div class="logo"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/CRPF_Logo.svg" alt="Original CRPF monogram"></div><div class="eyebrow">CRPF COOKING HOUSE SYSTEM</div>
<h1>Mess NCO Login</h1><p id="intro">Apna username aur password daal kar mess system kholiye.</p>
<form id="loginForm">
<div class="field"><label for="username">MESS NCO USERNAME</label><input id="username" autocomplete="username" required maxlength="40" placeholder="Username"></div>
<div class="field" id="oldWrap"><label for="password" id="passwordLabel">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Password"></div>
<div class="field hidden" id="newWrap"><label for="newPassword">NEW PASSWORD (MINIMUM 6 CHARACTERS)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="New password"></div>
<div class="field hidden" id="confirmWrap"><label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Confirm new password"></div>
<button id="submitBtn" type="submit">Login</button>
</form>
<button class="secondary hidden" id="continueBtn" type="button">Open Mess Dashboard</button>
<button class="secondary hidden" id="changeBtn" type="button">Change NCO Login</button>
<button class="secondary hidden" id="logoutBtn" type="button">Logout</button>
<div class="message" id="message" role="status"></div>
<div class="note">Pehli baar kholne par apna NCO username aur password banayein. Login isi browser/device par save rahega. Data ko surakshit rakhne ke liye regular Backup lete rahein.</div>
</main>
<script>
(function(){
"use strict";
const KEY="crpfMessLoginV1",SESSION="crpfMessLoginSessionV1";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const next=params.get("next")||"index.html";
const safeNext=/^(index|members|ration-store|purchases|recipes|making-menu|mess-staff|accounts|reports|mess-handover|settings|backup|software-guide)\.html(?:[?#].*)?$/.test(next)?next:"index.html";
let record=null,mode="login";
try{record=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){record=null}
function message(t){$("message").textContent=t}
function b64(bytes){return btoa(String.fromCharCode.apply(null,new Uint8Array(bytes)))}
async function digest(text){const data=new TextEncoder().encode(text);return b64(await crypto.subtle.digest("SHA-256",data))}
function setMode(m){
 mode=m;
 $("oldWrap").classList.toggle("hidden",m==="setup");
 $("newWrap").classList.toggle("hidden",m!=="setup"&&m!=="change");
 $("confirmWrap").classList.toggle("hidden",m!=="setup"&&m!=="change");
 $("intro").textContent=m==="setup"?"Pehli baar ke liye Mess NCO ka naya username aur password banayein.":m==="change"?"Purane NCO ka password verify karke naye NCO ka login set karein.":"Apna username aur password daal kar mess system kholiye.";
 $("submitBtn").textContent=m==="setup"?"Create NCO Login":m==="change"?"Save New NCO Login":"Login";
 $("passwordLabel").textContent=m==="change"?"CURRENT PASSWORD":"PASSWORD";
 // Hidden required fields can block the browser from submitting the form.
 $("password").required=m!=="setup";
 $("newPassword").required=m==="setup"||m==="change";
 $("confirmPassword").required=m==="setup"||m==="change";
}
if(!record){setMode("setup");}
else if(sessionStorage.getItem(SESSION)==="yes"){
 $("username").value=record.username||"";
 $("username").disabled=true;
 $("oldWrap").classList.add("hidden");
 $("submitBtn").classList.add("hidden");
 $("continueBtn").classList.remove("hidden");
 $("changeBtn").classList.remove("hidden");
 $("logoutBtn").classList.remove("hidden");
 $("intro").textContent="Aap login hain. Dashboard khol sakte hain ya naye Mess NCO ke liye login badal sakte hain.";
}
else{setMode("login")}
$("continueBtn").addEventListener("click",()=>location.replace(safeNext));
$("changeBtn").addEventListener("click",()=>{ $("username").disabled=false;$("username").value="";$("submitBtn").classList.remove("hidden");$("continueBtn").classList.add("hidden");$("changeBtn").classList.add("hidden");$("logoutBtn").classList.add("hidden");$("password").value="";setMode("change");});
$("logoutBtn").addEventListener("click",()=>{sessionStorage.removeItem(SESSION);location.reload()});
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();message("");
 const username=$("username").value.trim(),password=$("password").value;
 if(!username){message("Username daaliye.");return}
 try{
  if(mode==="setup"){
   const np=$("newPassword").value,cp=$("confirmPassword").value;
   if(np.length<6){message("Password kam se kam 6 characters ka rakhein.");return}
   if(np!==cp){message("Dono password match nahi kar rahe.");return}
   const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
   record={username,salt,hash:await digest(salt+np),updatedAt:new Date().toISOString()};
   localStorage.setItem(KEY,JSON.stringify(record));sessionStorage.setItem(SESSION,"yes");location.replace("index.html");return;
  }
  const check=await digest(record.salt+password);
  if(mode==="login"){
   if(username.toLowerCase()!==String(record.username).toLowerCase()||check!==record.hash){message("Username ya password galat hai.");return}
   sessionStorage.setItem(SESSION,"yes");location.replace(safeNext);return;
  }
  if(check!==record.hash){message("Purana password galat hai.");return}
  const np=$("newPassword").value,cp=$("confirmPassword").value;
  if(np.length<6){message("Naya password kam se kam 6 characters ka rakhein.");return}
  if(np!==cp){message("Naye password match nahi kar rahe.");return}
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem(KEY,JSON.stringify({username,salt,hash:await digest(salt+np),updatedAt:new Date().toISOString()}));
  sessionStorage.setItem(SESSION,"yes");message("NCO login update ho gaya.");setTimeout(()=>location.replace("index.html"),700);
 }catch(err){message("Browser security feature available nahi hai. Website HTTPS par kholiye.");}
});
})();
</script>
</body></html>
